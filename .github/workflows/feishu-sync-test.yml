name: Feishu test sync
on:
  push:
    branches: [codex/feishu-sync-test]
  workflow_dispatch:
permissions: {}
jobs:
  test-sync:
    if: github.ref == 'refs/heads/codex/feishu-sync-test'
    runs-on: ubuntu-latest
    steps:
      - name: Write a synthetic commit to the test base
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_TEST_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_TEST_APP_SECRET }}
          RUN_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request, uuid
          app_id = os.environ.get('FEISHU_APP_ID', '')
          app_secret = os.environ.get('FEISHU_APP_SECRET', '')
          if not app_id or not app_secret:
              sys.exit('Missing test application credentials in repository secrets')
          def post(url, payload, token=None):
              headers = {'Content-Type': 'application/json; charset=utf-8'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              request = urllib.request.Request(url, data=json.dumps(payload, ensure_ascii=False).encode(), headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  stage = 'authentication' if token is None else 'record creation'
                  try:
                      code = json.load(exc).get('code')
                  except (ValueError, AttributeError):
                      code = 'unavailable'
                  sys.exit(f'Feishu {stage} failed: HTTP {exc.code}, code {code}')
              except (urllib.error.URLError, TimeoutError):
                  sys.exit('Feishu request failed or timed out')
              if result.get('code') != 0:
                  sys.exit(f"Feishu request failed: code {result.get('code')}")
              return result
          auth = post('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {'app_id': app_id, 'app_secret': app_secret})
          token = auth.get('tenant_access_token')
          if not token:
              sys.exit('Feishu did not return an application token')
          key = str(uuid.UUID(bytes=uuid.uuid5(uuid.NAMESPACE_URL, 'feishu-synthetic-test:' + os.environ['RUN_COMMIT']).bytes, version=4))
          url = 'https://open.feishu.cn/open-apis/bitable/v1/apps/EvyDbLvtuag1N7s8uw1crgKvnwh/tables/tblZtSo9miNki40y/records?' + urllib.parse.urlencode({'client_token': key})
          post(url, {'fields': {'Commit Message': 'test: GitHub 自动同步模拟记录', '项目名称': '评分系统（模拟）', 'Commit ID': 'synthetic-' + key}}, token)
          print('Synthetic record written to the Feishu test base')
          PY
